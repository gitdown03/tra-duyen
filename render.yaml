databases:
  - name: tra-duyen-db
    databaseName: traduyen
    user: traduyen
    plan: free

services:
  - type: web
    name: tra-duyen
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tra-duyen-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CONTACT_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_INIT_TOKEN
        generateValue: true
      - key: MAIL_PROVIDER
        value: sandbox
