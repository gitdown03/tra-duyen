services:
  - type: web
    name: tra-duyen
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CONTACT_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_INIT_TOKEN
        generateValue: true
      - key: MAIL_PROVIDER
        value: sandbox
